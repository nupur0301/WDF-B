<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student API CRUD</title>
<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f7fb;
    }
    h2{
        color: #003366;
    }
    table{
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
    }
    th, td{
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
    }
    th{
        background: #003366;
        color: white;
    }
    button{
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .delete-btn{
        background: #c0392b;
        color: white;
    }
    .edit-btn{
        background: #0059B3;
        color: white;
    }
    .form-box{
        margin-top: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
    }
    .form-box input, .form-box select{
        width: 100%;
        padding: 10px;
        margin: 6px 0 12px;
        box-sizing: border-box;
    }
    .form-box button{
        background: #003366;
        color: white;
    }
    #messageBox{
        margin: 15px 0;
        padding: 12px;
        border-radius: 6px;
        display: none;
        font-weight: bold;
    }
    #messageBox.success{
        background: #d4edda;
        color: #155724;
    }
    #messageBox.error{
        background: #f8d7da;
        color: #721c24;
    }
    #messageBox.loading{
        background: #fff3cd;
        color: #856404;
    }
    #searchBox{
    width: 100%;
    max-width: 420px;
    padding: 12px 14px;
    margin: 18px 0 10px;
    border: 2px solid #003366;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
}

#searchBox:focus{
    border-color: #0059B3;
    box-shadow: 0 0 6px rgba(0, 89, 179, 0.25);
}
#statusFilter{
    width: 100%;
    max-width: 220px;
    padding: 12px 14px;
    margin: 18px 0 10px 10px;
    border: 2px solid #003366;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    box-sizing: border-box;
    background: white;
}

#statusFilter:focus{
    border-color: #0059B3;
    box-shadow: 0 0 6px rgba(0, 89, 179, 0.25);
}
</style>
</head>
<body>

<h2>Student API CRUD</h2>
<div id="messageBox"></div>

<input type="text" id="searchBox" placeholder="Search by name, email, mobile or course" oninput="searchStudents()">
<select id="statusFilter" onchange="filterStudents()">
    <option value="">All Status</option>
    <option value="active">Active</option>
    <option value="inactive">Inactive</option>
</select>
<div class="form-box">
    <h3>Add Student</h3>
    <input type="text" id="name" placeholder="Name">
    <input type="email" id="email" placeholder="Email">
    <input type="text" id="mobile" placeholder="Mobile">
    <input type="text" id="course" placeholder="Course">
    <input type="text" id="year" placeholder="Year">
    <select id="status">
        <option value="active">Active</option>
        <option value="inactive">Inactive</option>
    </select>
    <button onclick="addStudent()">Add Student</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Mobile</th>
            <th>Course</th>
            <th>Year</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="studentTableBody">
    </tbody>
</table>

<script>
function showMessage(message, type = 'success') {
    const box = document.getElementById('messageBox');
    box.className = '';
    box.classList.add(type);
    box.style.display = 'block';
    box.textContent = message;

    setTimeout(() => {
        box.style.display = 'none';
    }, 3000);
}

async function loadStudents() {
    const messageBox = document.getElementById('messageBox');
    messageBox.className = 'loading';
    messageBox.style.display = 'block';
    messageBox.textContent = 'Loading students...';

    try {
        const response = await fetch('api/students_list.php');

        if (!response.ok) {
            throw new Error('Network response was not ok');
        }

        const result = await response.json();
        const tbody = document.getElementById('studentTableBody');
        tbody.innerHTML = '';

        if (result.status === 'success') {
            result.data.forEach(student => {
                tbody.innerHTML += `
                    <tr>
                        <td>${student.student_id}</td>
                        <td>${student.name}</td>
                        <td>${student.email}</td>
                        <td>${student.mobile}</td>
                        <td>${student.course}</td>
                        <td>${student.year}</td>
                        <td>${student.status}</td>
                        <td>
                            <button class="edit-btn" onclick="editStudent(${student.student_id})">Edit</button>
                            <button class="delete-btn" onclick="deleteStudent(${student.student_id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            messageBox.style.display = 'none';
        } else {
            messageBox.className = 'error';
            messageBox.textContent = result.message || 'Failed to load students.';
        }
    } catch (error) {
        messageBox.className = 'error';
        messageBox.textContent = 'Error loading students.';
    }
}
let searchTimer;

function searchStudents() {
    clearTimeout(searchTimer);

    searchTimer = setTimeout(() => {
        const query = document.getElementById('searchBox').value.toLowerCase();
        const rows = document.querySelectorAll('#studentTableBody tr');
        let visibleCount = 0;

        rows.forEach(row => {
            const text = row.innerText.toLowerCase();
            if (text.includes(query)) {
                row.style.display = '';
                visibleCount++;
            } else {
                row.style.display = 'none';
            }
        });

        const messageBox = document.getElementById('messageBox');
        if (visibleCount === 0) {
            messageBox.className = 'error';
            messageBox.style.display = 'block';
            messageBox.textContent = 'No matching students found.';
        } else {
            messageBox.style.display = 'none';
        }
    }, 300);
}
function filterStudents() {
    const statusValue = document.getElementById('statusFilter').value.toLowerCase();
    const rows = document.querySelectorAll('#studentTableBody tr');

    rows.forEach(row => {
        const statusCell = row.children[6];
        const rowStatus = statusCell.innerText.toLowerCase();

        if (statusValue === '' || rowStatus === statusValue) {
            row.style.display = '';
        } else {
            row.style.display = 'none';
        }
    });
}

async function addStudent() {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const mobile = document.getElementById('mobile').value.trim();
    const course = document.getElementById('course').value.trim();
    const year = document.getElementById('year').value.trim();
    const status = document.getElementById('status').value;

    if (!name || !email || !mobile || !course || !year) {
        showMessage('Please fill all fields before adding student.', 'error');
        return;
    }

    const student = {
        name: name,
        email: email,
        mobile: mobile,
        course: course,
        year: year,
        status: status
    };

    showMessage('Adding student...', 'loading');

    const response = await fetch('api/student_add.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(student)
    });

    const result = await response.json();
    showMessage(result.message, result.status === 'success' ? 'success' : 'error');

    if (result.status === 'success') {
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('mobile').value = '';
        document.getElementById('course').value = '';
        document.getElementById('year').value = '';
        document.getElementById('status').value = 'active';
        loadStudents();
    }
}

async function deleteStudent(id) {
    if (!confirm('Are you sure you want to delete this student?')) {
        return;
    }
    showMessage('Deleting student...', 'loading');
    const response = await fetch('api/student_delete.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ student_id: id })
    });
        const result = await response.json();
    showMessage(result.message, result.status === 'success' ? 'success' : 'error');
    loadStudents();
}

async function editStudent(id) {
    const response = await fetch('api/students_list.php');
    const result = await response.json();

    if (result.status !== 'success') {
        showMessage('Failed to load student data', 'error');
        return;
    }

    const student = result.data.find(s => s.student_id == id);

    if (!student) {
        showMessage('Student not found', 'error');
        return;
    }

    const name = prompt('Enter name', student.name);
    if (name === null) return;

    const email = prompt('Enter email', student.email);
    if (email === null) return;

    const mobile = prompt('Enter mobile', student.mobile);
    if (mobile === null) return;

    const course = prompt('Enter course', student.course);
    if (course === null) return;

    const year = prompt('Enter year', student.year);
    if (year === null) return;

    const status = prompt('Enter status (active/inactive)', student.status);
    if (status === null) return;

    showMessage('Updating student...', 'loading');

    const updateResponse = await fetch('api/student_update.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            student_id: id,
            name: name,
            email: email,
            mobile: mobile,
            course: course,
            year: year,
            status: status
        })
    });

    const updateResult = await updateResponse.json();
    showMessage(updateResult.message, updateResult.status === 'success' ? 'success' : 'error');
    loadStudents();
}

loadStudents();
</script>

</body>
</html>
