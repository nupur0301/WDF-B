<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event API CRUD</title>
<style>
    body{
        font-family: Arial, sans-serif;
        padding: 20px;
        background: #f5f7fb;
    }
    h2{
        color: #003366;
    }
    table{
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
        background: white;
    }
    th, td{
        border: 1px solid #ccc;
        padding: 10px;
        text-align: center;
        vertical-align: middle;
    }
    th{
        background: #003366;
        color: white;
    }
    button{
        padding: 8px 12px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }
    .delete-btn{
        background: #c0392b;
        color: white;
    }
    .edit-btn{
        background: #0059B3;
        color: white;
    }
    .form-box{
        margin-top: 20px;
        background: white;
        padding: 15px;
        border-radius: 8px;
    }
    .form-box input, .form-box select{
        width: 100%;
        padding: 10px;
        margin: 6px 0 12px;
        box-sizing: border-box;
    }
    .form-box button{
        background: #003366;
        color: white;
    }
    .poster-img{
        width: 80px;
        height: auto;
        border-radius: 4px;
    }
    #messageBox{
        margin: 15px 0;
        padding: 12px;
        border-radius: 6px;
        display: none;
        font-weight: bold;
    }
    #messageBox.success{
        background: #d4edda;
        color: #155724;
    }
    #messageBox.error{
        background: #f8d7da;
        color: #721c24;
    }
    #messageBox.loading{
        background: #fff3cd;
        color: #856404;
    }
    .top-links{
    margin:20px 0;
}

.top-links a{
    display:inline-block;
    padding:10px 16px;
    margin:5px;
    background:#003366;
    color:white;
    text-decoration:none;
    border-radius:6px;
    font-weight:bold;
}

.top-links a:hover{
    background:#0059B3;
}
</style>
</head>
<body>
<div class="top-links">
    <a href="admin_dashboard.php">Dashboard</a>
    <a href="students.php">Students</a>
    <a href="events.php">Events</a>
    <a href="students_api.html">Student API</a>
    <a href="events_api.html">Event API</a>
    <a href="add_event.php">Add Event</a>
    <a href="logout.php">Logout</a>
</div>
<h2>Event API CRUD</h2>
<div id="messageBox"></div>

<div class="form-box">
    <h3>Add Event</h3>
    <input type="text" id="event_name" placeholder="Event Name">
    <input type="date" id="event_date">
    <input type="text" id="venue" placeholder="Venue">
    <input type="text" id="category" placeholder="Category">
    <select id="status">
        <option value="open">Open</option>
        <option value="closed">Closed</option>
    </select>
   <input type="file" id="poster" accept=".jpg,.jpeg,.png,.webp">
    <button onclick="addEvent()">Add Event</button>
</div>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Event Name</th>
            <th>Date</th>
            <th>Venue</th>
            <th>Category</th>
            <th>Status</th>
            <th>Poster</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="eventTableBody"></tbody>
</table>

<script>
function showMessage(message, type = 'success') {
    const box = document.getElementById('messageBox');
    box.className = '';
    box.classList.add(type);
    box.style.display = 'block';
    box.textContent = message;

    setTimeout(() => {
        box.style.display = 'none';
    }, 3000);
}

async function loadEvents() {
    showMessage('Loading events...', 'loading');

    try {
        const response = await fetch('api/events_list.php');
        const result = await response.json();

        const tbody = document.getElementById('eventTableBody');
        tbody.innerHTML = '';

        if (result.status === 'success') {
            result.data.forEach(event => {
                tbody.innerHTML += `
                    <tr>
                        <td>${event.event_id}</td>
                        <td>${event.event_name}</td>
                        <td>${event.event_date}</td>
                        <td>${event.venue}</td>
                        <td>${event.category}</td>
                        <td>${event.status}</td>
                      
                        <td>${event.poster ? `<img src="uploads/${event.poster}" alt="Poster" style="width:80px; height:auto;">` : 'No Poster'}</td>
                            <button class="edit-btn" onclick="editEvent(${event.event_id})">Edit</button>
                            <button class="delete-btn" onclick="deleteEvent(${event.event_id})">Delete</button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('messageBox').style.display = 'none';
        } else {
            showMessage(result.message || 'Failed to load events.', 'error');
        }
    } catch (error) {
        showMessage('Error loading events.', 'error');
    }
}

async function addEvent() {
    const event_name = document.getElementById('event_name').value.trim();
    const event_date = document.getElementById('event_date').value.trim();
    const venue = document.getElementById('venue').value.trim();
    const category = document.getElementById('category').value.trim();
    const status = document.getElementById('status').value;
    const poster = document.getElementById('poster').value.trim();

    if (!event_name || !event_date || !venue || !category) {
        showMessage('Please fill all required fields.', 'error');
        return;
    }

    showMessage('Adding event...', 'loading');

    const response = await fetch('api/event_add.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            event_name: event_name,
            event_date: event_date,
            venue: venue,
            category: category,
            status: status,
            poster: poster
        })
    });

    const result = await response.json();
    showMessage(result.message, result.status === 'success' ? 'success' : 'error');

    if (result.status === 'success') {
        document.getElementById('event_name').value = '';
        document.getElementById('event_date').value = '';
        document.getElementById('venue').value = '';
        document.getElementById('category').value = '';
        document.getElementById('status').value = 'open';
        document.getElementById('poster').value = '';
        loadEvents();
    }
}
async function editEvent(id) {
    const response = await fetch('api/events_list.php');
    const result = await response.json();
    if (result.status !== 'success') {
        showMessage('Failed to load event data', 'error');
        return;
    }
    const event = result.data.find(e => e.event_id == id);
    if (!event) {
        showMessage('Event not found', 'error');
        return;
    }
    const event_name = prompt('Enter event name', event.event_name);
    if (event_name === null) return;
    const event_date = prompt('Enter event date (YYYY-MM-DD)', event.event_date);
    if (event_date === null) return;
    const venue = prompt('Enter venue', event.venue);
    if (venue === null) return;
    const category = prompt('Enter category', event.category);
    if (category === null) return;
    const status = prompt('Enter status (open/closed)', event.status);
    if (status === null) return;
    const poster = prompt('Enter poster filename', event.poster);
    if (poster === null) return;
    showMessage('Updating event...', 'loading');
    const updateResponse = await fetch('api/event_update.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({
            event_id: id,
            event_name: event_name,
            event_date: event_date,
            venue: venue,
            category: category,
            status: status,
            poster: poster
        })
    });
    const updateResult = await updateResponse.json();
    showMessage(updateResult.message, updateResult.status === 'success' ? 'success' : 'error');
    loadEvents();
}
async function deleteEvent(id) {
    if (!confirm('Are you sure you want to delete this event?')) {
        return;
    }
    showMessage('Deleting event...', 'loading');
    const response = await fetch('api/event_delete.php', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ event_id: id })
    });
    const result = await response.json();
    showMessage(result.message, result.status === 'success' ? 'success' : 'error');
    loadEvents();
}
loadEvents();
</script>
</body>
</html>
